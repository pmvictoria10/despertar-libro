<style>
:root{--g-dark:#0e0c0a;--ink:#f3ede3;--ink-muted:#c9bea9;--ink-dark:#1c1712;--gold:#d4ae66}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--g-dark);color:var(--ink);font:400 17px/1.7 "Libre Baskerville",Georgia,serif;padding:24px;text-align:center}

a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/portada-480.jpg" alt="Portada de El despertar de tu mejor versión" width="480" height="750">
